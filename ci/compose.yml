# The MCP server and the fake login provider are not services here: ci/e2e.sh
# starts them *inside* the FreeScout container, because that is what production
# does — one pod, one network namespace, the bridge on loopback and nowhere
# else. Separate services would test a setup we do not ship.
name: freescout-mcp-e2e

services:
  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root-for-tests
      MARIADB_DATABASE: freescout
      MARIADB_USER: freescout
      MARIADB_PASSWORD: freescout-for-tests
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 60

  freescout:
    image: nfrastack/freescout:2.2.10
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SETUP_TYPE: AUTO
      APP_URL: http://127.0.0.1:8080
      DB_TYPE: mariadb
      DB_HOST: mariadb
      DB_NAME: freescout
      DB_USER: freescout
      DB_PASS: freescout-for-tests
      ADMIN_EMAIL: post@levinkeller.de
      ADMIN_PASS: e2e-admin-password-1234
      ADMIN_FIRST_NAME: Levin
      ADMIN_LAST_NAME: Keller
      TIMEZONE: Europe/Berlin
      # LARAVEL_ENV_PREFIX is FREESCOUT_ in this image, so these land in the
      # application's .env without the prefix.
      FREESCOUT_MCP_BRIDGE_TOKEN: bridge-token-for-tests
      FREESCOUT_ZITADEL_ISSUER: http://127.0.0.1:8082
      FREESCOUT_ZITADEL_CLIENT_ID: freescout-web
      FREESCOUT_ZITADEL_FORCE_LOGIN: "true"
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8082:8082"
    volumes:
      - ./.stage/custom-scripts:/override/custom-scripts:ro
      - ./:/ci:ro
