# Check-Name im Ruleset: `test` (Workflow `Test`, Job-Id `test`).
name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.24"
          cache: false

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Nicht formatiert:"; echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - run: go vet ./...

      - run: go test -count 1 ./...

      - name: PHP-Syntax aller Moduldateien
        run: |
          php -v
          find modules -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: PHP-Tests
        run: php modules/tests/run.php
